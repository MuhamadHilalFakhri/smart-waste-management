name: Pemeriksaan
on: [push, pull_request]
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, gd
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: composer install --no-interaction
        working-directory: apps/web
      - run: cp .env.example .env && php artisan key:generate && npm ci && npm run build && npm run types:check && composer test
        working-directory: apps/web
  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run lint && npx tsc --noEmit
        working-directory: apps/mobile
  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: services/ml/requirements.lock
      - run: pip install -r requirements-dev.txt && python -m unittest discover -s tests -v
        working-directory: services/ml
        env:
          ML_TOKEN: test-service-token-123456
